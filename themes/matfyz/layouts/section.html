{{ define "main" }}
  <section class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Content }}
      <div class="content">
        {{ . }}
      </div>
    {{ end }}
  </section>
  <div class="listing-grid">
    {{ range .Sections.ByWeight }}
      <article class="card">
        <h2 class="card__title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
        <div class="card__summary">{{ .Summary }}</div>
      </article>
    {{ end }}
    {{ range .RegularPages.ByWeight }}
      <article class="card">
        <h2 class="card__title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
        <div class="card__summary">{{ .Summary }}</div>
      </article>
    {{ end }}
  </div>
{{ end }}
